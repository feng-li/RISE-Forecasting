frequency: MS
shock:
  start: 2020-01
  end: 2022-12
dates:
  observed_until: 2023-01
  initial_date: 2023-06
  forecast_start: 2023-08
  terminal_date: 2024-07
  forecast_end: 2024-07
base:
  train_end: 2019-12
  validation_start: 2018-01
  validation_end: 2019-12
  horizon: 60
  models:
  - seasonal_naive
  - random_walk_drift
  - arima
  - ets
  - holt
  - holt_winters
  ensemble: mean
  selection_fraction: 0.8
  validation_metric: mape
  stacking_alpha: 1.0
reference:
  start: 2023-01
  end: 2023-06
  train_end: 2023-01
  x:
  - name: search_arimax
    variables:
    - search_index
    method: arimax
    lag: 1
  - name: search_ratio
    variables:
    - search_index
    method: ratio
    lag: 1
    ratio_window: 36
  - name: flight_growth
    variables:
    - flight_capacity
    method: growth_rate
recovery:
  method: regression
  coefficient_column: coefficient
  score_columns:
  - policy
  - distance
  - recovery
  weights:
    policy: 1.0
    distance: 1.0
    recovery: 1.0
  anchors:
    canada: 0.65
    mexico: 1.0
    hong_kong: 0.85
  min_coefficient: 0.0
  max_coefficient: 1.0
  score_min: 1.0
  score_max: 5.0
  fit_intercept: true
  preserve_anchors: true
curve:
  curves:
  - linear
  - quadratic
  - logistic
  seasonal_period: 12
  trend_history_start: 2022-01
  trend_history_end: 2023-06
  quadratic_terminal_weight: 18
  logistic_anchor_dates:
  - 2023-12
  - 2024-07
  - 2024-12
columns:
  date: date
  series_id: series_id
  kind: kind
  name: name
  value: value
  lower: lower
  upper: upper
kinds:
- observed
- signal
- base_forecast
- reference_forecast
- terminal_forecast
- recovery_forecast
notes:
- series_id is the general quantity of interest; in this example it maps to tourism
  destinations.
- recovery.method=regression follows the paper-style score-to-coefficient calibration;
  coefficient values in series.csv are retained for legacy checks.
- reference_forecast rows are dated January through June 2023 to match the legacy
  reference.xlsx artifact.
