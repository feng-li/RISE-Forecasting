frequency: MS
shock:
  start: 2020-01
  end: 2022-12
dates:
  observed_until: 2023-01
  initial_date: 2023-06
  forecast_start: 2023-08
  terminal_date: 2024-07
  forecast_end: 2024-07
reference:
  start: 2023-01
  end: 2023-06
  train_end: 2023-01
  x:
  - name: search_arimax
    variables:
    - search_index
    method: arimax
    lag: 1
  - name: search_ratio
    variables:
    - search_index
    method: ratio
    lag: 1
    ratio_window: 36
  - name: flight_growth
    variables:
    - flight_capacity
    method: growth_rate
columns:
  date: date
  series_id: series_id
  kind: kind
  name: name
  value: value
  lower: lower
  upper: upper
kinds:
- observed
- signal
- base_forecast
- reference_forecast
- terminal_forecast
- recovery_forecast
notes:
- series_id is the general quantity of interest; in this example it maps to tourism
  destinations.
- coefficient values in series.csv follow the legacy notebook implementation.
- reference_forecast rows are dated January through June 2023 to match the legacy
  reference.xlsx artifact.
